<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Site Maintenance — FREEFIRE XIPL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0705;
            --surface: #14100a;
            --surface-2: #1c1610;
            --line: rgba(240, 185, 61, 0.16);
            --gold: #f0b93d;
            --gold-pale: #fbe4a6;
            --ink: #f4ecd8;
            --ink-dim: #a9997d;
            --ink-faint: #6b5f4c;
            --ok: #5fd97e;
            --err: #ff5c4d;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            background: rgba(10, 7, 5, 0.92);
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .topbar h1 {
            font-size: 16px;
            margin: 0;
            letter-spacing: 0.02em;
            color: var(--gold-pale);
        }

        .topbar h1 b { color: var(--gold); }

        .whoami { font-size: 11.5px; color: var(--ink-faint); font-family: 'Space Mono', monospace; }

        .container { max-width: 720px; margin: 0 auto; padding: 20px 16px 80px; }

        /* ---- Login gate ---- */
        .gate { max-width: 360px; margin: 60px auto; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
        .gate h2 { margin: 0 0 4px; font-size: 20px; color: var(--gold-pale); }
        .gate p { margin: 0 0 18px; color: var(--ink-dim); font-size: 13px; }
        .field-input {
            width: 100%; padding: 12px 14px; margin-bottom: 10px; border-radius: 10px;
            border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
            font-family: 'Rajdhani', sans-serif; font-size: 14px;
        }
        .field-input:focus { outline: none; border-color: var(--gold); }
        .btn {
            width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer;
            font-weight: 700; letter-spacing: 0.03em; font-size: 13.5px; text-transform: uppercase;
            background: var(--gold); color: #1a1206;
        }
        .btn:disabled { opacity: 0.5; cursor: default; }
        .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink-dim); width: auto; padding: 8px 14px; }
        .msg { margin-top: 10px; font-size: 12.5px; }
        .msg.err { color: var(--err); }
        .msg.ok { color: var(--ok); }

        /* ---- Page tabs ---- */
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .tab {
            padding: 8px 14px; border-radius: 100px; border: 1px solid var(--line);
            background: var(--surface); color: var(--ink-dim); font-size: 12.5px; font-weight: 700;
            cursor: pointer; letter-spacing: 0.02em;
        }
        .tab.active { border-color: var(--gold); color: var(--gold-pale); background: rgba(240, 185, 61, 0.1); }

        .search-input { width: 100%; margin-bottom: 14px; }

        /* ---- Field cards ---- */
        .field-card {
            background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
            padding: 14px; margin-bottom: 10px;
        }
        .field-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .field-label { font-size: 13.5px; font-weight: 700; color: var(--ink); }
        .field-key { font-size: 10px; color: var(--ink-faint); font-family: 'Space Mono', monospace; margin-top: 1px; }
        .badge-override { font-size: 9.5px; padding: 3px 8px; border-radius: 100px; background: rgba(95, 217, 126, 0.15); color: var(--ok); font-weight: 700; letter-spacing: 0.03em; white-space: nowrap; }
        textarea.field-value, input.field-value {
            width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
            background: var(--surface-2); color: var(--ink); font-family: 'Space Mono', monospace; font-size: 12.5px;
            resize: vertical; min-height: 40px;
        }
        textarea.field-value:focus, input.field-value:focus { outline: none; border-color: var(--gold); }
        .field-actions { display: flex; gap: 8px; margin-top: 10px; }
        .field-actions button {
            padding: 8px 14px; border-radius: 8px; border: none; font-size: 11.5px; font-weight: 700;
            letter-spacing: 0.03em; cursor: pointer; text-transform: uppercase;
        }
        .save-btn { background: var(--gold); color: #1a1206; }
        .save-btn:disabled { opacity: 0.35; cursor: default; }
        .reset-btn { background: rgba(255, 92, 77, 0.14); color: var(--err); }
        .field-status { font-size: 11px; margin-top: 6px; min-height: 14px; }

        .empty, .loading { text-align: center; color: var(--ink-faint); padding: 40px 0; font-size: 13px; }
        .top-actions { display: flex; gap: 8px; margin-bottom: 16px; }
        a.home-link { color: var(--ink-faint); text-decoration: none; font-size: 12px; }
    </style>
</head>

<body>

    <div class="topbar">
        <h1>🔧 Site <b>Maintenance</b></h1>
        <div id="topbarRight"></div>
    </div>

    <div class="container">

        <!-- LOGIN GATE -->
        <div id="gateWrap" class="gate">
            <h2>Admin Sign In</h2>
            <p>Sign in with your admin account to edit site content.</p>
            <input class="field-input" type="email" id="adminEmail" placeholder="Admin email" autocomplete="username">
            <input class="field-input" type="password" id="adminPass" placeholder="Password" autocomplete="current-password">
            <button class="btn" id="loginBtn">Sign In</button>
            <div class="msg" id="gateMsg"></div>
            <p style="margin-top:16px;"><a class="home-link" href="home.html">← Back to site</a></p>
        </div>

        <!-- PANEL -->
        <div id="panelWrap" style="display:none;">
            <div class="top-actions">
                <a class="home-link" href="home.html">← Back to site</a>
            </div>
            <div class="tabs" id="pageTabs"></div>
            <input class="field-input search-input" id="searchBox" placeholder="Search fields by name…">
            <div id="fieldsWrap"><div class="loading">Loading…</div></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ---- CONFIG: same Supabase project as the rest of the site ----
        const SUPABASE_URL = 'https://ndioutmihxodqknvgfju.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kaW91dG1paHhvZHFrbnZnZmp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNTg2NDMsImV4cCI6MjA5ODYzNDY0M30.KeSyXI6DFvYnKbBxICmrmQ8t8eFIoxPn9Ln1aBU0OUk';
        const ADMINS_TABLE = 'ffxipl_s12_admins';
        const CMS_TABLE = 'ffxipl_s12_site_content';

        // ---- Registry of editable pages. Add a new {id, label, path} entry
        // here whenever data-cms-key attributes are added to another page. ----
        const PAGES = [
            { id: 'home', label: 'Home', path: 'home.html' },
            { id: 'registration-center', label: 'Registration Center', path: 'registration-center.html' },
        ];

        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const gateWrap = document.getElementById('gateWrap');
        const panelWrap = document.getElementById('panelWrap');
        const gateMsg = document.getElementById('gateMsg');
        const topbarRight = document.getElementById('topbarRight');
        const pageTabs = document.getElementById('pageTabs');
        const fieldsWrap = document.getElementById('fieldsWrap');
        const searchBox = document.getElementById('searchBox');

        let currentUser = null;
        let currentPageId = PAGES[0].id;
        let currentFields = []; // [{key,label,attr,defaultValue,overrideValue,el}]

        function showGateMsg(text, kind) {
            gateMsg.textContent = text;
            gateMsg.className = 'msg ' + kind;
        }

        async function verifyAdminAndEnter(user) {
            const { data, error } = await sb.from(ADMINS_TABLE).select('user_id').eq('user_id', user.id).maybeSingle();
            if (error) { showGateMsg('Could not verify admin access: ' + error.message, 'err'); return; }
            if (!data) { showGateMsg('This account is not registered as an admin.', 'err'); return; }
            currentUser = user;
            gateWrap.style.display = 'none';
            panelWrap.style.display = 'block';
            topbarRight.innerHTML = '<span class="whoami">' + user.email + '</span> <button class="btn-ghost" id="logoutBtn" style="margin-left:10px;">Sign Out</button>';
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await sb.auth.signOut();
                window.location.reload();
            });
            renderTabs();
            loadPage(currentPageId);
        }

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPass').value;
            if (!email || !password) { showGateMsg('Enter email and password.', 'err'); return; }
            showGateMsg('Signing in…', '');
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) { showGateMsg(error.message, 'err'); return; }
            await verifyAdminAndEnter(data.user);
        });

        // Resume session if already signed in
        (async () => {
            const { data } = await sb.auth.getSession();
            if (data && data.session && data.session.user) {
                await verifyAdminAndEnter(data.session.user);
            }
        })();

        function renderTabs() {
            pageTabs.innerHTML = '';
            PAGES.forEach(p => {
                const btn = document.createElement('div');
                btn.className = 'tab' + (p.id === currentPageId ? ' active' : '');
                btn.textContent = p.label;
                btn.addEventListener('click', () => { currentPageId = p.id; renderTabs(); loadPage(p.id); });
                pageTabs.appendChild(btn);
            });
        }

        async function loadPage(pageId) {
            fieldsWrap.innerHTML = '<div class="loading">Loading fields…</div>';
            const page = PAGES.find(p => p.id === pageId);
            try {
                // 1. Fetch the live page HTML and find every data-cms-key element —
                //    this is the single source of truth for which fields exist and
                //    what the ORIGINAL hardcoded value is.
                const res = await fetch(page.path, { cache: 'no-store' });
                const html = await res.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const nodes = [...doc.querySelectorAll('[data-cms-key]')];

                // 2. Fetch any saved overrides for this page.
                const { data: overrides, error } = await sb.from(CMS_TABLE).select('key, value').eq('page', pageId);
                if (error) console.warn('Override fetch failed:', error.message);
                const overrideMap = {};
                (overrides || []).forEach(o => { overrideMap[o.key] = o.value; });

                currentFields = nodes.map(node => {
                    const key = node.getAttribute('data-cms-key');
                    const attr = node.getAttribute('data-cms-attr');
                    const defaultValue = attr ? (node.getAttribute(attr) || '') : node.innerHTML.trim();
                    return {
                        key,
                        label: node.getAttribute('data-cms-label') || key,
                        attr,
                        defaultValue,
                        overrideValue: Object.prototype.hasOwnProperty.call(overrideMap, key) ? overrideMap[key] : null,
                    };
                });
                renderFields();
            } catch (e) {
                fieldsWrap.innerHTML = '<div class="empty">Could not load this page (' + e.message + '). Make sure admin.html sits in the same folder as the site pages.</div>';
            }
        }

        function renderFields() {
            const q = searchBox.value.trim().toLowerCase();
            fieldsWrap.innerHTML = '';
            const filtered = currentFields.filter(f => !q || f.label.toLowerCase().includes(q) || f.key.toLowerCase().includes(q));
            if (!filtered.length) { fieldsWrap.innerHTML = '<div class="empty">No editable fields found.</div>'; return; }

            filtered.forEach(f => {
                const card = document.createElement('div');
                card.className = 'field-card';

                const hasOverride = f.overrideValue !== null;
                const shownValue = hasOverride ? f.overrideValue : f.defaultValue;
                const isLong = shownValue.length > 60 || shownValue.includes('<');

                card.innerHTML = `
                    <div class="field-head">
                        <div>
                            <div class="field-label">${f.label}</div>
                            <div class="field-key">${f.key}</div>
                        </div>
                        ${hasOverride ? '<span class="badge-override">EDITED</span>' : ''}
                    </div>
                    ${isLong
                        ? `<textarea class="field-value" rows="3">${escapeHtml(shownValue)}</textarea>`
                        : `<input class="field-value" type="text" value="${escapeHtml(shownValue)}">`}
                    <div class="field-actions">
                        <button class="save-btn">Save</button>
                        ${hasOverride ? '<button class="reset-btn">Reset to default</button>' : ''}
                    </div>
                    <div class="field-status"></div>
                `;

                const input = card.querySelector('.field-value');
                const saveBtn = card.querySelector('.save-btn');
                const resetBtn = card.querySelector('.reset-btn');
                const status = card.querySelector('.field-status');

                saveBtn.addEventListener('click', async () => {
                    saveBtn.disabled = true;
                    status.textContent = 'Saving…';
                    status.style.color = 'var(--ink-faint)';
                    const { error } = await sb.from(CMS_TABLE).upsert({
                        key: f.key,
                        page: currentPageId,
                        label: f.label,
                        value: input.value,
                        updated_at: new Date().toISOString(),
                        updated_by: currentUser ? currentUser.email : null,
                    }, { onConflict: 'key' });
                    saveBtn.disabled = false;
                    if (error) { status.textContent = 'Error: ' + error.message; status.style.color = 'var(--err)'; return; }
                    status.textContent = 'Saved ✓';
                    status.style.color = 'var(--ok)';
                    f.overrideValue = input.value;
                    setTimeout(() => loadPage(currentPageId), 500);
                });

                if (resetBtn) {
                    resetBtn.addEventListener('click', async () => {
                        if (!confirm('Reset "' + f.label + '" back to the original text in the file?')) return;
                        resetBtn.disabled = true;
                        const { error } = await sb.from(CMS_TABLE).delete().eq('key', f.key);
                        if (error) { status.textContent = 'Error: ' + error.message; status.style.color = 'var(--err)'; resetBtn.disabled = false; return; }
                        loadPage(currentPageId);
                    });
                }

                fieldsWrap.appendChild(card);
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML.replace(/"/g, '&quot;');
        }

        searchBox.addEventListener('input', renderFields);
    </script>
</body>

</html>
