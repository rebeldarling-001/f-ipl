<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05030d">
<title>Govinda 🙏 — Sri Venkateswara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Noto+Sans+Telugu:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#05030d;
    --bg-2:#0c0722;
    --blue:#22d3ee;
    --violet:#a855f7;
    --gold:#f5c451;
    --gold-soft:#ffe4a3;
    --ember:#ff7a3d;
    --ink:#f4efff;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg-1);
    overflow-x:hidden;
  }

  body{
    min-height:100svh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Poppins',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 90% 45% at 50% 10%, rgba(168,85,247,0.20), transparent 60%),
      radial-gradient(ellipse 80% 35% at 50% 92%, rgba(34,211,238,0.13), transparent 60%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 55%, var(--bg-1));
    position:relative;
    -webkit-user-select:none;
    user-select:none;
  }

  .scene{
    position:relative;
    width:100%;
    max-width:480px;
    padding:calc(28px + var(--safe-top)) 18px calc(28px + var(--safe-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    z-index:2;
  }

  /* ---------- ambient diya particles ---------- */
  .particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
  }
  .spark{
    position:absolute;
    bottom:-10px;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--gold-soft);
    box-shadow:0 0 6px 2px rgba(245,196,81,0.55);
    opacity:0;
    animation:rise linear infinite;
    will-change:transform,opacity;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.9; }
    90%{ opacity:.5; }
    100%{ transform:translateY(-100vh) translateX(var(--drift,20px)); opacity:0; }
  }

  /* ---------- eyebrow ---------- */
  .eyebrow{
    font-family:'Noto Sans Telugu','Poppins',sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:.04em;
    color:var(--gold-soft);
    opacity:.85;
    margin:0 0 18px;
    text-shadow:0 0 14px rgba(245,196,81,0.35);
  }

  /* ---------- reveal frame ---------- */
  .reveal-wrap{
    position:relative;
    width:100%;
    border-radius:16px;
    padding:3px;
    background:linear-gradient(135deg, var(--gold) 0%, var(--violet) 45%, var(--blue) 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 20px 50px -18px rgba(168,85,247,0.55),
      0 0 34px -8px rgba(34,211,238,0.35);
  }
  .reveal-inner{
    position:relative;
    border-radius:13px;
    overflow:hidden;
    background:#000;
    line-height:0;
  }
  #revealCanvas{
    display:block;
    width:100%;
    height:auto;
  }
  .scanline-overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
    opacity:0;
    transition:opacity .6s ease;
  }
  .reveal-wrap.glitching .scanline-overlay{ opacity:1; }

  .frame-tag{
    position:absolute;
    top:9px;
    left:10px;
    font-size:10px;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:var(--gold-soft);
    background:rgba(5,3,13,0.55);
    padding:4px 9px;
    border-radius:999px;
    border:1px solid rgba(245,196,81,0.35);
    opacity:0;
    transition:opacity .5s ease;
    backdrop-filter:blur(3px);
  }
  .reveal-wrap.done .frame-tag{ opacity:1; }

  /* ---------- title block ---------- */
  .title-block{
    margin-top:26px;
    opacity:0;
    transform:translateY(14px);
    transition:opacity 1s ease, transform 1s ease;
  }
  .title-block.show{
    opacity:1;
    transform:translateY(0);
  }
  .title-block h1{
    font-family:'Cinzel Decorative', serif;
    font-weight:700;
    font-size:clamp(32px, 10vw, 48px);
    margin:0;
    background:linear-gradient(90deg, var(--gold-soft), var(--gold) 40%, var(--ember) 75%, var(--gold-soft));
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shine 5s linear infinite;
    letter-spacing:.02em;
  }
  @keyframes shine{
    to{ background-position:200% center; }
  }
  .title-block .pray{
    -webkit-text-fill-color:initial;
    filter:drop-shadow(0 0 10px rgba(245,196,81,0.6));
  }
  .title-block .sub{
    font-family:'Noto Sans Telugu','Poppins',sans-serif;
    font-size:15px;
    font-weight:400;
    color:rgba(244,239,255,0.65);
    letter-spacing:.06em;
    margin:6px 0 0;
  }

  /* ---------- replay ---------- */
  .replay{
    margin-top:24px;
    background:transparent;
    border:1px solid rgba(245,196,81,0.4);
    color:var(--gold-soft);
    font-family:'Poppins',sans-serif;
    font-size:13px;
    font-weight:500;
    letter-spacing:.05em;
    padding:13px 24px;
    border-radius:999px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .6s ease, background .25s ease, transform .15s ease, border-color .25s ease;
    -webkit-appearance:none;
    appearance:none;
    min-height:44px;
  }
  .replay.show{
    opacity:1;
    pointer-events:auto;
  }
  .replay:active{
    transform:scale(0.96);
    background:rgba(245,196,81,0.12);
  }

  .save-hint{
    margin-top:16px;
    font-size:11px;
    letter-spacing:.06em;
    color:rgba(244,239,255,0.32);
    max-width:280px;
  }

  .fallback-note{
    display:none;
    margin-top:10px;
    font-size:11px;
    color:rgba(255,122,61,0.85);
  }

  @media (prefers-reduced-motion: reduce){
    .spark{ animation:none; display:none; }
    .title-block{ transition:none; }
  }
</style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <div class="scene">
    <p class="eyebrow">ఓం నమో వేంకటేశాయ</p>

    <div class="reveal-wrap" id="revealWrap">
      <div class="reveal-inner">
        <canvas id="revealCanvas"></canvas>
        <img id="fallbackImg" alt="Sri Venkateswara" style="display:none;width:100%;height:auto;" />
        <div class="scanline-overlay"></div>
        <span class="frame-tag">Sri Venkateswara</span>
      </div>
    </div>

    <div class="title-block" id="titleBlock">
      <h1>Govinda <span class="pray">🙏</span></h1>
      <p class="sub">గోవింద గోవింద</p>
    </div>

    <button class="replay" id="replayBtn" type="button">⟲ Reveal again</button>
    <p class="save-hint">Long-press the image to save it once revealed</p>
  </div>

  var canvas = document.getElementById('revealCanvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var wrap = document.getElementById('revealWrap');
  var titleBlock = document.getElementById('titleBlock');
  var replayBtn = document.getElementById('replayBtn');
  var fallbackImg = document.getElementById('fallbackImg');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var img = new Image();
  var W = 0, H = 0, running = false, ready = false;

  var src = document.createElement('canvas');
  var sctx = src.getContext('2d');

  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
  function lerp(a,b,t){ return a + (b - a) * t; }
  function rand(a,b){ return a + Math.random() * (b - a); }

  function showStaticFallback(){
    // If canvas animation can't run for any reason, just show the real image.
    canvas.style.display = 'none';
    fallbackImg.src = IMAGE_SRC;
    fallbackImg.style.display = 'block';
    wrap.classList.add('done');
    titleBlock.classList.add('show');
    replayBtn.style.display = 'none';
  }

  function sizeCanvas(){
    var ratio = img.naturalHeight / img.naturalWidth;
    W = canvas.clientWidth || wrap.clientWidth || 320;
    H = Math.round(W * ratio);
    canvas.width = W;
    canvas.height = H;
    src.width = W;
    src.height = H;
    sctx.drawImage(img, 0, 0, W, H);
  }

  function drawPixelated(blockSize){
    var bw = Math.max(1, Math.round(W / blockSize));
    var bh = Math.max(1, Math.round(H / blockSize));
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(src, 0, 0, W, H, 0, 0, bw, bh);
    ctx.drawImage(canvas, 0, 0, bw, bh, 0, 0, W, H);
  }

  function drawChannelSplit(offset, alpha){
    if(offset <= 0.2 || alpha <= 0.01) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.globalCompositeOperation = 'screen';
    ctx.drawImage(canvas, -offset, 0);
    ctx.drawImage(canvas, offset, offset * 0.4);
    ctx.restore();
  }

  function drawNoise(alpha){
    if(alpha <= 0.01) return;
    var cell = 3;
    var cols = Math.ceil(W / cell);
    var rows = Math.ceil(H / cell);
    var count = Math.floor(cols * rows * 0.018);
    ctx.save();
    ctx.globalAlpha = alpha;
    for(var i=0;i<count;i++){
      var x = Math.floor(Math.random()*cols)*cell;
      var y = Math.floor(Math.random()*rows)*cell;
      var v = Math.random();
      ctx.fillStyle = v < 0.33 ? 'rgba(34,211,238,0.8)' : v < 0.66 ? 'rgba(168,85,247,0.8)' : 'rgba(255,255,255,0.6)';
      ctx.fillRect(x,y,cell,cell);
    }
    ctx.restore();
  }

  function drawTear(chance){
    if(Math.random() > chance) return;
    try{
      var sliceH = rand(4, 22);
      var y = rand(0, Math.max(1, H - sliceH));
      var dx = rand(-24, 24);
      var imgData = ctx.getImageData(0, y, W, sliceH);
      ctx.clearRect(0, y, W, sliceH);
      ctx.putImageData(imgData, dx, y);
    }catch(e){ /* skip tear effect if pixel read is unavailable */ }
  }

  function frame(elapsed, duration){
    if(!running) return;
    var t = Math.min(elapsed / duration, 1);
    var eased = easeOutCubic(t);

    var blockSize = lerp(28, 1, eased);
    drawPixelated(blockSize);

    var splitOffset = lerp(13, 0, eased);
    var splitAlpha = lerp(0.45, 0, eased);
    drawChannelSplit(splitOffset, splitAlpha);

    var noiseAlpha = lerp(0.32, 0, Math.min(1, eased * 1.3));
    drawNoise(noiseAlpha);

    if(t < 0.55){ drawTear(0.10); }

    if(t < 1){
      requestAnimationFrame(function(){ frame(elapsed + 16, duration); });
    } else {
      ctx.imageSmoothingEnabled = true;
      ctx.clearRect(0,0,W,H);
      ctx.drawImage(src, 0, 0, W, H);
      finish();
    }
  }

  function finish(){
    wrap.classList.remove('glitching');
    wrap.classList.add('done');
    setTimeout(function(){
      titleBlock.classList.add('show');
      replayBtn.classList.add('show');
    }, 220);
    running = false;
  }

  function play(){
    if(!ready || running) return;
    running = true;
    wrap.classList.remove('done');
    titleBlock.classList.remove('show');
    replayBtn.classList.remove('show');

    if(reduceMotion){
      ctx.imageSmoothingEnabled = true;
      ctx.clearRect(0,0,W,H);
      ctx.drawImage(src, 0, 0, W, H);
      finish();
      return;
    }

    wrap.classList.add('glitching');
    frame(0, 2200);
  }

  img.onload = function(){
    try{
      sizeCanvas();
      ready = true;
      play();
    }catch(e){
      showStaticFallback();
    }
  };

  img.onerror = function(){
    showStaticFallback();
  };

  img.src = IMAGE_SRC;

  window.addEventListener('resize', function(){
    if(!ready) return;
    sizeCanvas();
    if(wrap.classList.contains('done')){
      ctx.clearRect(0,0,W,H);
      ctx.drawImage(src, 0, 0, W, H);
    }
  });

  replayBtn.addEventListener('click', play);

  // ambient particles
  var particleField = document.getElementById('particles');
  var N = 18;
  for(var i=0;i<N;i++){
    var s = document.createElement('span');
    s.className = 'spark';
    var left = rand(0,100);
    var dur = rand(7, 16);
    var delay = rand(0, 12);
    var drift = rand(-40, 40);
    s.style.left = left + 'vw';
    s.style.animationDuration = dur + 's';
    s.style.animationDelay = delay + 's';
    s.style.setProperty('--drift', drift + 'px');
    particleField.appendChild(s);
  }

  // safety net: if something goes wrong and nothing ever renders, fall back after 4s
  setTimeout(function(){
    if(!ready){ showStaticFallback(); }
  }, 4000);
})();
</script>
