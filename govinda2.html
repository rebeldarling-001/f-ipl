<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Venkateswara — Signal Reveal</title>
<style>
  :root{
    --gold: #f4c14a;
    --gold-deep: #b8842a;
    --violet: #7c4dff;
    --violet-deep: #3a1e8a;
    --cyan: #2fd8e6;
    --ink: #05060a;
    --bezel-top: #3a3d44;
    --bezel-mid: #16171b;
    --bezel-bottom: #06070a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(120% 100% at 50% 0%, #14161c 0%, #07080b 55%, #020203 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }

  .stage {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vh 4vw 0;
    position: relative;
  }

  /* ambient room glow that breathes once the reveal completes */
  .room-glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(45% 35% at 50% 38%, rgba(124,77,255,0.0) 0%, rgba(124,77,255,0.0) 100%);
    transition: background 1.2s ease;
  }
  .stage.lit .room-glow {
    background: radial-gradient(45% 40% at 50% 40%, rgba(124,77,255,0.18) 0%, rgba(47,216,230,0.05) 45%, rgba(0,0,0,0) 75%);
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  /* ---------- Laptop assembly ---------- */
  .laptop {
    width: min(920px, 92vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    filter: drop-shadow(0 40px 60px rgba(0,0,0,0.6));
  }

  .lid {
    width: 100%;
    background: linear-gradient(155deg, var(--bezel-top) 0%, var(--bezel-mid) 40%, var(--bezel-bottom) 100%);
    border-radius: 14px 14px 6px 6px;
    padding: 14px 14px 20px;
    position: relative;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 0 0 1px rgba(255,255,255,0.03);
  }

  .lid::before{ /* camera dot */
    content: "";
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #0b0c0f;
    box-shadow: 0 0 0 1px #2a2c31, 0 0 3px rgba(80,160,255,0.0);
  }

  .screen-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9.4;
    border-radius: 4px;
    overflow: hidden;
    background: #000;
    box-shadow: inset 0 0 0 2px #000, inset 0 0 18px rgba(0,0,0,0.9);
  }

  .screen {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #000;
  }

  /* the real image, sits at the bottom of the stack */
  .art {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    filter: saturate(1) brightness(1);
    transform: scale(1.015);
    transition: opacity 1.4s cubic-bezier(.22,.61,.36,1), filter 1.4s ease;
  }
  .screen.revealed .art {
    opacity: 1;
  }

  /* subtle persistent vignette + glass sheen over the screen */
  .glass {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(255,255,255,0.06), rgba(255,255,255,0) 40%),
      radial-gradient(140% 120% at 50% 120%, rgba(0,0,0,0.55), rgba(0,0,0,0) 55%);
    z-index: 6;
  }

  /* noise canvas for the static / signal-searching phase */
  canvas.noise {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    opacity: 1;
    mix-blend-mode: screen;
    transition: opacity 0.9s ease;
  }
  .screen.revealed canvas.noise {
    opacity: 0;
  }

  /* scanlines, always faintly present for CRT/broadcast feel */
  .scanlines {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.16) 0px,
      rgba(0,0,0,0.16) 1px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0) 3px
    );
    opacity: 0.5;
    transition: opacity 1s ease;
  }
  .screen.revealed .scanlines {
    opacity: 0.16;
  }

  /* glitch bands during the unstable phase */
  .glitch-band {
    position: absolute;
    left: 0;
    width: 100%;
    background: rgba(255,255,255,0.03);
    z-index: 7;
    pointer-events: none;
  }

  /* signal-lock flash sweep at the moment of reveal */
  .flash {
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0) 60%);
    transform: translateX(-140%);
    z-index: 8;
    pointer-events: none;
    opacity: 0;
  }
  .flash.run {
    animation: sweep 0.7s cubic-bezier(.2,.8,.2,1) 1;
  }
  @keyframes sweep {
    0% { transform: translateX(-140%); opacity: 0.9; }
    60% { opacity: 0.65; }
    100% { transform: translateX(140%); opacity: 0; }
  }

  /* title text, styled after the devotional caption */
  .caption {
    position: absolute;
    top: 9%;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 9;
    pointer-events: none;
  }
  .caption span {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: clamp(1.4rem, 4.4vw, 2.6rem);
    font-weight: 800;
    letter-spacing: 0.01em;
    color: #fff;
    text-shadow: 0 0 18px rgba(244,193,74,0.35), 0 2px 10px rgba(0,0,0,0.6);
    opacity: 0;
    filter: blur(6px);
    transform: translateY(6px);
    transition: opacity 0.6s ease, filter 0.6s ease, transform 0.6s ease;
  }
  .caption.show span {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
  }
  .caption.glitching span {
    animation: textGlitch 0.14s steps(2) infinite;
  }
  @keyframes textGlitch {
    0% { transform: translate(0,0); text-shadow: 2px 0 var(--cyan), -2px 0 #ff3d6b; }
    50% { transform: translate(-1px,0.5px); text-shadow: -2px 0 var(--cyan), 2px 0 #ff3d6b; }
    100% { transform: translate(0,0); text-shadow: 2px 0 var(--cyan), -2px 0 #ff3d6b; }
  }

  /* small "signal" status pill, quiet UI chrome */
  .status {
    position: absolute;
    bottom: 4.2%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 5px 12px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    gap: 7px;
    opacity: 0.9;
    transition: opacity 0.4s ease;
  }
  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ff5252;
    box-shadow: 0 0 6px #ff5252;
  }
  .status.locked .dot {
    background: #3ee08a;
    box-shadow: 0 0 6px #3ee08a;
  }

  /* ---------- keyboard deck, echoing the reference screenshots ---------- */
  .deck {
    width: 108%;
    max-width: 1000px;
    margin-top: -4px;
    background: linear-gradient(180deg, #1c1e23 0%, #0c0d10 100%);
    border-radius: 6px 6px 16px 16px;
    padding: 16px 22px 22px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .hinge {
    height: 8px;
    width: 40%;
    margin: 0 auto 12px;
    background: #08090b;
    border-radius: 0 0 8px 8px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 4px;
    opacity: 0.85;
  }
  .keys div {
    aspect-ratio: 1.2;
    background: linear-gradient(160deg, #2a2d33, #16171b);
    border-radius: 3px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 1px 0 rgba(0,0,0,0.4);
  }
  .keys .wide { grid-column: span 2; }

  /* replay control */
  .replay {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(10,11,14,0.7);
    backdrop-filter: blur(6px);
    color: #f1eee6;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.25s ease, transform 0.15s ease, border-color 0.25s ease;
  }
  .replay:hover { background: rgba(20,21,26,0.9); border-color: rgba(244,193,74,0.4); }
  .replay:active { transform: scale(0.96); }
  .replay svg { width: 14px; height: 14px; }

  @media (max-width: 640px) {
    .stage { padding: 3vh 3vw 0; }
    .deck { padding: 12px 14px 16px; }
    .keys { grid-template-columns: repeat(10, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    .art { transition: opacity 0.5s linear; }
    canvas.noise { display: none; }
    .flash, .caption.glitching span { animation: none; }
  }
</style>
</head>

<script>
(function(){
  // build the faint keyboard grid
  const keys = document.getElementById('keys');
  const rows = [14,14,13,12,10];
  rows.forEach((count, r) => {
    for (let i=0;i<count;i++){
      const k = document.createElement('div');
      if (r === 4 && i === 4) k.className = 'wide'; // space-ish bar
      keys.appendChild(k);
    }
  });

  const screenEl   = document.getElementById('screen');
  const stageEl    = document.getElementById('stage');
  const canvas     = document.getElementById('noise');
  const ctx        = canvas.getContext('2d', { alpha: true });
  const flashEl    = document.getElementById('flash');
  const captionEl  = document.getElementById('caption');
  const statusEl   = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const replayBtn  = document.getElementById('replayBtn');

  const NW = 160, NH = 90; // low-res noise buffer, scaled up for a chunky broadcast-static look
  canvas.width = NW;
  canvas.height = NH;

  const palette = [
    [255,255,255],
    [244,193,74],   // gold
    [124,77,255],   // violet
    [47,216,230],   // cyan
    [10,10,14]
  ];

  let rafId = null;
  let timers = [];

  function clearTimers(){
    timers.forEach(t => clearTimeout(t));
    timers = [];
    if (rafId) cancelAnimationFrame(rafId);
  }

  function drawNoise(intensity){
    const img = ctx.createImageData(NW, NH);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      let r,g,b,a;
      if (Math.random() < 0.055 * intensity) {
        const c = palette[(Math.random()*palette.length)|0];
        r=c[0]; g=c[1]; b=c[2];
        a = 200 * intensity;
      } else {
        const v = (Math.random()*255)|0;
        r=g=b=v;
        a = 120 * intensity;
      }
      d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=a;
    }
    ctx.putImageData(img, 0, 0);
  }

  function noiseLoop(startTime, duration){
    function frame(now){
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      // intensity ramps from strong static down toward a light flicker as t -> 1
      const intensity = 1 - Math.pow(t, 2) * 0.55;
      drawNoise(intensity);
      if (t < 1) {
        rafId = requestAnimationFrame(frame);
      }
    }
    rafId = requestAnimationFrame(frame);
  }

  function spawnGlitchBands(container, count, spanMs){
    for (let i=0;i<count;i++){
      const delay = Math.random() * spanMs;
      const t = setTimeout(() => {
        const band = document.createElement('div');
        band.className = 'glitch-band';
        const h = 4 + Math.random()*22;
        band.style.height = h + 'px';
        band.style.top = (Math.random()*100) + '%';
        band.style.transform = `translateX(${(Math.random()<0.5?-1:1)*(6+Math.random()*18)}px)`;
        band.style.mixBlendMode = 'overlay';
        container.appendChild(band);
        setTimeout(() => band.remove(), 90 + Math.random()*110);
      }, delay);
      timers.push(t);
    }
  }

  function runReveal(){
    clearTimers();
    screenEl.classList.remove('revealed');
    stageEl.classList.remove('lit');
    captionEl.classList.remove('show');
    captionEl.classList.add('glitching');
    flashEl.classList.remove('run');
    statusEl.classList.remove('locked');
    statusText.textContent = 'Searching signal';
    canvas.style.opacity = '1';

    const GLITCH_DURATION = 1900;

    // static begins immediately
    noiseLoop(performance.now(), GLITCH_DURATION);
    spawnGlitchBands(screenEl, 10, GLITCH_DURATION);

    // caption flickers into view partway through the static
    timers.push(setTimeout(() => {
      captionEl.classList.add('show');
    }, 420));

    // a second, denser burst of glitch bands right before lock
    timers.push(setTimeout(() => {
      spawnGlitchBands(screenEl, 6, 300);
    }, GLITCH_DURATION - 350));

    // signal lock: reveal the image, flash sweep, settle caption
    timers.push(setTimeout(() => {
      screenEl.classList.add('revealed');
      flashEl.classList.add('run');
      captionEl.classList.remove('glitching');
      statusEl.classList.add('locked');
      statusText.textContent = 'Signal locked';
    }, GLITCH_DURATION));

    // ambient room light breathes in once the picture has settled
    timers.push(setTimeout(() => {
      stageEl.classList.add('lit');
    }, GLITCH_DURATION + 500));

    // fade the status pill back after it's done its job
    timers.push(setTimeout(() => {
      statusEl.style.opacity = '0';
    }, GLITCH_DURATION + 2600));
  }

  replayBtn.addEventListener('click', () => {
    statusEl.style.opacity = '0.9';
    runReveal();
  });

  window.addEventListener('DOMContentLoaded', runReveal);
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    runReveal();
  }
})();
</script>
